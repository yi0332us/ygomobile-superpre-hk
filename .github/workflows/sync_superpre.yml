name: 同步與繁化官方先行卡

on:
  schedule:
    # 每小時整點檢查一次（只喺上游版本有變先會真正下載同轉換）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '強制重新下載同繁化（修正轉換邏輯後第一次要剔，否則版本一致會直接略過）'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 檢出倉庫
        uses: actions/checkout@v4

      - name: 安裝 Python 與 OpenCC
        run: |
          python3 -m pip install opencc-python-reimplemented

      - name: 檢查版本並執行簡繁轉換
        env:
          FORCE: ${{ inputs.force }}
          OPENCC_CONFIG: s2twp
        run: |
          python3 sync_and_convert.py

      - name: 提交並推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt test-release.json ygopro-super-pre.ypk
          if git diff --staged --quiet; then
            echo "沒有任何更新，略過 commit"
          else
            git commit -m "自動更新：同步最新繁中先行卡"
            git push
          fi
